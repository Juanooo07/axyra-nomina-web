<div class="gestion-personal-container">
  <h1><i class="fas fa-users"></i> Gestión de Personal</h1>

  <!-- Estadísticas -->
  <div class="estadisticas-container">
    <div class="stat-card">
      <i class="fas fa-users stat-icon"></i>
      <h3 id="totalEmpleados">0</h3>
      <p>Empleados</p>
      <div class="stat-trend">+0% este mes</div>
    </div>
    <div class="stat-card">
      <i class="fas fa-clock stat-icon"></i>
      <h3 id="totalHoras">0</h3>
      <p>Registros de Horas</p>
      <div class="stat-trend">+0% esta semana</div>
    </div>
    <div class="stat-card">
      <i class="fas fa-building stat-icon"></i>
      <h3 id="totalDepartamentos">0</h3>
      <p>Departamentos</p>
      <div class="stat-trend">Activos</div>
    </div>
    <div class="stat-card">
      <i class="fas fa-chart-line stat-icon"></i>
      <h3 id="promedioHoras">0</h3>
      <p>Promedio Horas/Registro</p>
      <div class="stat-trend">Eficiencia</div>
    </div>
  </div>

  <!-- Pestañas -->
  <div class="gestion-personal-tabs">
    <button class="gestion-personal-tab active" onclick="cambiarTab('horas')">
      <i class="fas fa-clock"></i> Registro de Horas
    </button>
    <button class="gestion-personal-tab" onclick="cambiarTab('empleados')">
      <i class="fas fa-users"></i> Empleados
    </button>
    <button class="gestion-personal-tab" onclick="cambiarTab('departamentos')">
      <i class="fas fa-building"></i> Departamentos
    </button>
    <button class="gestion-personal-tab" onclick="cambiarTab('nomina')">
      <i class="fas fa-file-invoice-dollar"></i> Nómina
    </button>
    <button class="gestion-personal-tab" onclick="cambiarTab('reportes')">
      <i class="fas fa-chart-bar"></i> Reportes
    </button>
  </div>

  <!-- Contenido de Pestañas -->
  <div id="tab-horas" class="tab-content active">
    <div class="form-section">
      <h3><i class="fas fa-plus"></i> Registrar Horas</h3>
      <form id="formRegistroHoras">
        <div class="form-row">
          <div class="form-group">
            <label for="empleadoHoras">Empleado *</label>
            <select id="empleadoHoras" name="empleadoHoras" required>
              <option value="">Seleccionar empleado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fechaHoras">Fecha *</label>
            <input type="date" id="fechaHoras" name="fechaHoras" required />
          </div>
        </div>
        <!-- Más campos aquí -->
        <button type="submit" class="btn-primary">Registrar Horas</button>
      </form>
    </div>
  </div>

  <!-- Más tabs -->
  <div id="tab-empleados" class="tab-content">
    <div class="form-section">
      <h3><i class="fas fa-plus"></i> Gestionar Empleados</h3>
      <form id="formEmpleado">
        <!-- Campos del empleado -->
        <button type="submit" class="btn-primary">Guardar Empleado</button>
      </form>
    </div>
  </div>

  <!-- Más contenido -->
</div>
