sonar.projectKey=Axyra---Sistema-de-nomina
sonar.projectName=Axyra - Sistema de nomina
sonar.projectVersion=1.0
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.git/**,**/.github/**,**/*.log,**/*.test.*,**/*.spec.*,**/coverage/**,**/__tests__/**
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096
sonar.typescript.node.maxspace=4096

# TypeScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# Code coverage settings
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.config.*,**/*.d.ts,**/__tests__/**,**/*.stories.*

# Quality Gate settings
sonar.qualitygate.wait=true

# React specific rules
sonar.javascript.environments=node,browser
sonar.typescript.environments=node,browser
